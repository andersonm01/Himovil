default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: himovil_development
  host: <%= ENV.fetch("HIMOVIL_DATABASE_HOST", "/tmp") %>
  username: <%= ENV.fetch("HIMOVIL_DATABASE_USERNAME", "himovil") %>

test:
  <<: *default
  database: himovil_test
  host: <%= ENV.fetch("HIMOVIL_DATABASE_HOST", "/tmp") %>
  username: <%= ENV.fetch("HIMOVIL_DATABASE_USERNAME", "himovil") %>

# Railway (and most hosts) provide this as a single Postgres instance via DATABASE_URL.
production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
